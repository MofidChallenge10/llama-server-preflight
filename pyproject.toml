[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "llama-server-preflight"
version = "1.0.0"
description = "Preflight llama.cpp HTTP server readiness"
requires-python = ">=3.10"
[project.scripts]
llama_server_preflight = "llama_server_preflight.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
